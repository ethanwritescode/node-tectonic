name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: fetch binary
        run: node scripts/fetch-binaries.js --current

      - name: test
        run: npm test

      - name: integration test
        run: npm run test:integration

      - name: cli
        run: node bin/tectonic.js --version
